# =============================================================================
# PR Validation Workflow
# =============================================================================
# This workflow runs comprehensive checks on pull requests to ensure
# code quality and maintainability before merging.
#
# Features:
# - All quality checks (linting, testing)
# - PR size and complexity analysis
# - Automated labeling based on changes
# - Required status checks integration
# - PR comment with results
#
# Documentation:
# - https://docs.github.com/en/pull-requests/collaborating-with-pull-requests
# =============================================================================

name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - develop

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # PR Analysis
  # ===========================================================================
  analyze:
    name: Analyze PR
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    outputs:
      size: ${{ steps.size.outputs.size }}
      files-changed: ${{ steps.size.outputs.files }}
      lines-changed: ${{ steps.size.outputs.lines }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze PR Size
        id: size
        run: |
          # Get PR stats
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | wc -l)
          ADDITIONS=$(git diff --stat origin/${{ github.base_ref }}...HEAD | tail -1 | grep -oP '\d+(?= insertion)' || echo 0)
          DELETIONS=$(git diff --stat origin/${{ github.base_ref }}...HEAD | tail -1 | grep -oP '\d+(?= deletion)' || echo 0)
          TOTAL=$((ADDITIONS + DELETIONS))

          # Determine size category
          if [ $TOTAL -lt 50 ]; then
            SIZE="XS"
          elif [ $TOTAL -lt 200 ]; then
            SIZE="S"
          elif [ $TOTAL -lt 500 ]; then
            SIZE="M"
          elif [ $TOTAL -lt 1000 ]; then
            SIZE="L"
          else
            SIZE="XL"
          fi

          echo "files=${FILES}" >> $GITHUB_OUTPUT
          echo "lines=${TOTAL}" >> $GITHUB_OUTPUT
          echo "size=${SIZE}" >> $GITHUB_OUTPUT

          echo "## PR Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Files Changed | ${FILES} |" >> $GITHUB_STEP_SUMMARY
          echo "| Additions | ${ADDITIONS} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deletions | ${DELETIONS} |" >> $GITHUB_STEP_SUMMARY
          echo "| Total Lines | ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
          echo "| Size Category | ${SIZE} |" >> $GITHUB_STEP_SUMMARY

          if [ "$SIZE" = "XL" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Warning**: This is a large PR. Consider breaking it into smaller PRs." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Detect Change Types
        id: types
        run: |
          # Analyze changed files to determine PR type
          DOCS=false
          TESTS=false
          CODE=false
          CONFIG=false
          WORKFLOW=false

          git diff --name-only origin/${{ github.base_ref }}...HEAD | while read file; do
            case "$file" in
              *.md|docs/*)
                echo "docs=true" >> /tmp/changes
                ;;
              *test*|tests/*)
                echo "tests=true" >> /tmp/changes
                ;;
              .github/workflows/*|.github/actions/*)
                echo "workflow=true" >> /tmp/changes
                ;;
              *.yml|*.yaml|*.json|*.toml|*.ini|*.cfg)
                echo "config=true" >> /tmp/changes
                ;;
              *.py|*.js|*.ts|*.java|*.cs)
                echo "code=true" >> /tmp/changes
                ;;
            esac
          done

          # Output change types
          if grep -q "docs=true" /tmp/changes 2>/dev/null; then echo "docs=true" >> $GITHUB_OUTPUT; fi
          if grep -q "tests=true" /tmp/changes 2>/dev/null; then echo "tests=true" >> $GITHUB_OUTPUT; fi
          if grep -q "code=true" /tmp/changes 2>/dev/null; then echo "code=true" >> $GITHUB_OUTPUT; fi
          if grep -q "workflow=true" /tmp/changes 2>/dev/null; then echo "workflow=true" >> $GITHUB_OUTPUT; fi

  # ===========================================================================
  # Quality Checks
  # ===========================================================================
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    needs: analyze

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'apps/python-service/requirements.txt'

      - name: Install Dependencies
        run: |
          pip install -r apps/python-service/requirements.txt

      - name: Run Linting
        run: |
          cd apps/python-service
          flake8 app tests --statistics
          pylint app --exit-zero

      - name: Run Tests
        run: |
          cd apps/python-service
          pytest --cov=app --cov-report=xml --cov-report=term-missing --junitxml=test-results.xml

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-test-results
          path: |
            apps/python-service/test-results.xml
            apps/python-service/coverage.xml

  # ===========================================================================
  # PR Comment
  # ===========================================================================
  comment:
    name: Post PR Comment
    runs-on: ubuntu-latest
    needs: [analyze, quality]
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Create PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const size = '${{ needs.analyze.outputs.size }}';
            const files = '${{ needs.analyze.outputs.files-changed }}';
            const lines = '${{ needs.analyze.outputs.lines-changed }}';
            const qualityStatus = '${{ needs.quality.result }}';

            let sizeEmoji = '🟢';
            if (size === 'L') sizeEmoji = '🟡';
            if (size === 'XL') sizeEmoji = '🔴';

            const body = `## PR Validation Summary

            ### Size Analysis ${sizeEmoji}
            | Metric | Value |
            |--------|-------|
            | Files Changed | ${files} |
            | Lines Changed | ${lines} |
            | Size Category | ${size} |

            ### Quality Checks
            | Check | Status |
            |-------|--------|
            | Linting & Tests | ${qualityStatus === 'success' ? '✅ Passed' : '❌ Failed'} |

            ---
            ${size === 'XL' ? '⚠️ **Note**: This is a large PR. Consider breaking it into smaller, more focused PRs for easier review.' : ''}
            `;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes('PR Validation Summary'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
