# =============================================================================
# CI Workflow for Python Microservice
# =============================================================================
# This workflow demonstrates a stack-specific CI pattern for Python applications.
# It includes linting, testing, security scanning, and artifact publishing.
#
# Key Features Demonstrated:
# - Python setup with caching
# - Matrix builds for multiple Python versions
# - Quality checks (pylint, flake8)
# - Unit tests with coverage
# - Dependency caching for faster builds
# - Artifact upload for build results
# - Concurrency control to prevent duplicate runs
# - Job dependencies with needs
#
# Documentation References:
# - https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
# - https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
# =============================================================================

name: Python CI

# =============================================================================
# Workflow Triggers
# =============================================================================
# This workflow runs on:
# - Push to main or develop branches
# - Pull requests targeting main or develop
# - Manual dispatch with optional parameters
# - Scheduled runs for nightly testing
# =============================================================================
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/python-service/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/reusable/**'
      - '.github/actions/**'

  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/python-service/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/reusable/**'
      - '.github/actions/**'

  # Manual trigger with optional inputs
  workflow_dispatch:
    inputs:
      run_security_scan:
        description: 'Run security scanning'
        required: false
        default: 'true'
        type: boolean
      python_version:
        description: 'Python version to use'
        required: false
        default: '3.11'
        type: choice
        options:
          - '3.11'
          - '3.12'

  # Scheduled nightly run for dependency checks
  schedule:
    - cron: '0 0 * * *'  # Run at midnight UTC

# =============================================================================
# Concurrency Control
# =============================================================================
# Prevents multiple runs of the same workflow on the same branch.
# This helps save resources and ensures consistent state.
# =============================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# Environment Variables
# =============================================================================
# Global environment variables available to all jobs.
# Use vars context for repository/org-level variables.
# =============================================================================
env:
  # Default Python version (can be overridden via repository variables)
  DEFAULT_PYTHON_VERSION: ${{ vars.DEFAULT_PYTHON_VERSION || '3.11' }}
  # Working directory for Python service
  PYTHON_SERVICE_DIR: apps/python-service
  # Enable pip caching
  PIP_CACHE_DIR: ~/.cache/pip
  # Test configuration
  PYTEST_ADDOPTS: '--color=yes'

# =============================================================================
# Workflow Jobs
# =============================================================================
jobs:
  # ===========================================================================
  # Lint Job - Code Quality Checks
  # ===========================================================================
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    # Set minimum required permissions (least privilege principle)
    permissions:
      contents: read

    steps:
      # Checkout code with minimal depth for faster checkout
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Setup Python environment with caching
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: ${{ env.PYTHON_SERVICE_DIR }}/requirements.txt

      # Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: ${{ env.PYTHON_SERVICE_DIR }}

      # Run flake8 linting
      - name: Run Flake8
        run: |
          echo "::group::Running Flake8 Linting"
          flake8 app tests --format=default --statistics
          echo "::endgroup::"
        working-directory: ${{ env.PYTHON_SERVICE_DIR }}

      # Run pylint linting
      - name: Run Pylint
        run: |
          echo "::group::Running Pylint"
          pylint app --exit-zero --output-format=colorized
          echo "::endgroup::"
        working-directory: ${{ env.PYTHON_SERVICE_DIR }}

  # ===========================================================================
  # Test Job - Unit Tests with Coverage
  # ===========================================================================
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    # Matrix strategy for testing multiple Python versions
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    permissions:
      contents: read
      # Allow writing check annotations for test results
      checks: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: ${{ env.PYTHON_SERVICE_DIR }}/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: ${{ env.PYTHON_SERVICE_DIR }}

      # Run tests with coverage
      - name: Run Tests with Coverage
        run: |
          echo "::group::Running pytest with coverage"
          pytest --cov=app --cov-report=xml --cov-report=html --cov-report=term-missing --junitxml=test-results.xml
          echo "::endgroup::"
        working-directory: ${{ env.PYTHON_SERVICE_DIR }}

      # Upload test results as artifact
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: |
            ${{ env.PYTHON_SERVICE_DIR }}/test-results.xml
            ${{ env.PYTHON_SERVICE_DIR }}/coverage.xml
            ${{ env.PYTHON_SERVICE_DIR }}/htmlcov/
          retention-days: 30

      # Generate job summary with test results
      - name: Generate Test Summary
        if: always()
        run: |
          echo "## Test Results for Python ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Version | ${{ matrix.python-version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Security Scan Job
  # ===========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    # Only run if explicitly enabled or on main branch
    if: github.event.inputs.run_security_scan != 'false'

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: ${{ env.PYTHON_SERVICE_DIR }}/requirements.txt

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
        working-directory: ${{ env.PYTHON_SERVICE_DIR }}

      # Run Bandit security linter
      - name: Run Bandit Security Scan
        run: |
          echo "::group::Running Bandit Security Scan"
          bandit -r app -f json -o bandit-results.json --exit-zero || true
          bandit -r app -f screen --exit-zero
          echo "::endgroup::"
        working-directory: ${{ env.PYTHON_SERVICE_DIR }}

      # Upload security scan results
      - name: Upload Security Results
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: ${{ env.PYTHON_SERVICE_DIR }}/bandit-results.json
          retention-days: 30

  # ===========================================================================
  # Build Job - Create Distribution Artifacts
  # ===========================================================================
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: [test]
    # Only run on main branch or manual trigger
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read

    outputs:
      artifact-name: ${{ steps.package.outputs.artifact-name }}
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: ${{ env.PYTHON_SERVICE_DIR }}/requirements.txt

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel
        working-directory: ${{ env.PYTHON_SERVICE_DIR }}

      # Build wheel distribution
      - name: Build Package
        id: package
        run: |
          echo "::group::Building Python package"
          python -m build
          echo "::endgroup::"

          # Extract version from package
          VERSION=$(python setup.py --version)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "artifact-name=python-microservice-${VERSION}" >> $GITHUB_OUTPUT
        working-directory: ${{ env.PYTHON_SERVICE_DIR }}

      # Upload build artifacts
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: |
            ${{ env.PYTHON_SERVICE_DIR }}/dist/*
          retention-days: 30

      # Generate build summary
      - name: Generate Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.package.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | ${{ steps.package.outputs.artifact-name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Version | ${{ env.DEFAULT_PYTHON_VERSION }} |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Summary Job - Final Status
  # ===========================================================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, security-scan, build]
    if: always()

    steps:
      - name: Generate Final Summary
        run: |
          echo "# CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Workflow Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Event**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

      - name: Check Overall Status
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "::error::One or more required jobs failed"
            exit 1
          fi
          echo "✅ All required checks passed!"
