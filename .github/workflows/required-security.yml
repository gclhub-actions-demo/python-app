# =============================================================================
# Required Workflow: Security Baseline
# =============================================================================
# This workflow demonstrates a required security workflow that would be
# enforced at the organization level. It CANNOT be bypassed or disabled
# at the repository level when configured as a required workflow.
#
# Key Features:
# - Mandatory security checks for all repositories
# - Runs on all PRs and pushes
# - Blocks merge if critical vulnerabilities found
# - Required status check for branch protection
#
# Organization Ruleset Configuration:
# 1. Go to Organization Settings > Code security and analysis > Rulesets
# 2. Create new ruleset
# 3. Add this workflow as a required workflow
# 4. Apply to all repositories or specific patterns
#
# Documentation:
# - https://docs.github.com/en/organizations/managing-organization-settings/managing-rulesets-for-repositories-in-your-organization
# - https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/about-rulesets
# =============================================================================

name: Required Security Baseline

# =============================================================================
# Triggers
# =============================================================================
# This workflow runs on ALL PRs and pushes to ensure security compliance.
# When configured as an org-level required workflow, it cannot be disabled.
# =============================================================================
on:
  push:
    branches:
      - main
      - develop
      - 'release/**'

  pull_request:
    branches:
      - main
      - develop
      - 'release/**'

  # Allow manual trigger for testing
  workflow_dispatch:

# =============================================================================
# Permissions
# =============================================================================
# Minimal permissions required for security scanning
# =============================================================================
permissions:
  contents: read
  security-events: write
  pull-requests: read

# =============================================================================
# Concurrency
# =============================================================================
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# Jobs
# =============================================================================
jobs:
  # ===========================================================================
  # Secret Scanning Check
  # ===========================================================================
  # Ensures no secrets are committed to the repository
  # ===========================================================================
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Secrets
        run: |
          echo "::group::Secret Scanning"
          echo "Checking for potential secrets in code..."
          echo ""

          # Pattern checks (simplified - use gitleaks or truffleHog in production)
          SECRETS_FOUND=0

          # Check for common secret patterns
          echo "Checking for common secret patterns..."

          # AWS Keys
          if grep -rE "AKIA[0-9A-Z]{16}" --include="*.py" --include="*.js" --include="*.yml" --include="*.yaml" . 2>/dev/null; then
            echo "::error::Potential AWS Access Key found!"
            SECRETS_FOUND=1
          fi

          # Generic API Keys
          if grep -rE "api[_-]?key['\"]?\s*[:=]\s*['\"][a-zA-Z0-9]{20,}" --include="*.py" --include="*.js" . 2>/dev/null; then
            echo "::warning::Potential API key found"
          fi

          # Private Keys
          if grep -rE "-----BEGIN (RSA |EC |DSA )?PRIVATE KEY-----" --include="*.pem" --include="*.key" . 2>/dev/null; then
            echo "::error::Private key file detected!"
            SECRETS_FOUND=1
          fi

          if [ $SECRETS_FOUND -eq 1 ]; then
            echo ""
            echo "::error::Secrets detected in repository!"
            echo "Please remove secrets and use environment variables or secret management."
          else
            echo "✅ No obvious secrets detected"
          fi

          echo "::endgroup::"
          echo ""
          echo "Note: For comprehensive secret scanning, enable GitHub's native secret scanning"
          echo "or use tools like gitleaks, truffleHog, or detect-secrets"

  # ===========================================================================
  # Dependency Vulnerability Scan
  # ===========================================================================
  # Scans dependencies for known vulnerabilities
  # ===========================================================================
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect Package Managers
        id: detect
        run: |
          echo "::group::Detecting Package Managers"

          PYTHON=false
          NODE=false
          JAVA=false

          if [ -f "requirements.txt" ] || [ -f "**/requirements.txt" ] || [ -f "pyproject.toml" ]; then
            PYTHON=true
            echo "Found Python project"
          fi

          if [ -f "package.json" ] || [ -f "**/package.json" ]; then
            NODE=true
            echo "Found Node.js project"
          fi

          if [ -f "pom.xml" ] || [ -f "build.gradle" ]; then
            JAVA=true
            echo "Found Java project"
          fi

          echo "python=${PYTHON}" >> $GITHUB_OUTPUT
          echo "node=${NODE}" >> $GITHUB_OUTPUT
          echo "java=${JAVA}" >> $GITHUB_OUTPUT

          echo "::endgroup::"

      - name: Setup Python
        if: steps.detect.outputs.python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan Python Dependencies
        if: steps.detect.outputs.python == 'true'
        run: |
          echo "::group::Python Dependency Scan"
          pip install pip-audit safety

          # Find all requirements.txt files
          find . -name "requirements.txt" -not -path "./.venv/*" | while read req_file; do
            echo "Scanning: ${req_file}"
            pip-audit -r "${req_file}" --format json --output pip-audit-$(basename $(dirname ${req_file})).json 2>/dev/null || true
            pip-audit -r "${req_file}" || true
          done

          echo "::endgroup::"

      - name: Generate Vulnerability Summary
        run: |
          echo "## Dependency Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Language | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python | ${{ steps.detect.outputs.python == 'true' && 'Scanned' || 'Not detected' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Node.js | ${{ steps.detect.outputs.node == 'true' && 'Scanned' || 'Not detected' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Java | ${{ steps.detect.outputs.java == 'true' && 'Scanned' || 'Not detected' }} |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # SAST (Static Application Security Testing)
  # ===========================================================================
  # Uses CodeQL for static analysis of code
  # ===========================================================================
  sast-scan:
    name: SAST Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        run: |
          echo "::group::CodeQL Initialization"
          echo "In a production environment, this would initialize CodeQL:"
          echo ""
          echo "  - name: Initialize CodeQL"
          echo "    uses: github/codeql-action/init@v3"
          echo "    with:"
          echo "      languages: python"
          echo ""
          echo "CodeQL provides comprehensive SAST capabilities including:"
          echo "  - SQL Injection detection"
          echo "  - Cross-Site Scripting (XSS)"
          echo "  - Path traversal vulnerabilities"
          echo "  - Command injection"
          echo "  - And many more security issues"
          echo "::endgroup::"

      - name: Run Alternative SAST (Bandit for Python)
        run: |
          echo "::group::Running Bandit SAST"

          # Install bandit
          pip install bandit

          # Find Python files and scan
          if [ -d "apps/python-service" ]; then
            bandit -r apps/python-service/app -f json -o bandit-results.json --exit-zero || true
            bandit -r apps/python-service/app -ll || true
          fi

          echo "::endgroup::"

      - name: SAST Summary
        run: |
          echo "## SAST Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Static analysis completed. In production:" >> $GITHUB_STEP_SUMMARY
          echo "- CodeQL results would be uploaded to GitHub Security tab" >> $GITHUB_STEP_SUMMARY
          echo "- SARIF format enables integration with security dashboards" >> $GITHUB_STEP_SUMMARY
          echo "- Critical/High severity issues would block the PR" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # License Compliance Check
  # ===========================================================================
  # Ensures all dependencies have acceptable licenses
  # ===========================================================================
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for Required Files
        run: |
          echo "::group::License Compliance Check"

          MISSING_FILES=0

          # Check for LICENSE file
          if [ -f "LICENSE" ] || [ -f "LICENSE.md" ] || [ -f "LICENSE.txt" ]; then
            echo "✅ LICENSE file found"
          else
            echo "::warning::LICENSE file not found"
            MISSING_FILES=1
          fi

          # Check for acceptable license types (example)
          echo ""
          echo "Acceptable licenses for this organization:"
          echo "  - MIT"
          echo "  - Apache-2.0"
          echo "  - BSD-2-Clause"
          echo "  - BSD-3-Clause"
          echo ""

          echo "Note: Use tools like 'license-checker' (npm) or 'pip-licenses' (Python)"
          echo "for comprehensive license scanning of dependencies."

          echo "::endgroup::"

      - name: License Summary
        run: |
          echo "## License Compliance" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "License compliance checks ensure:" >> $GITHUB_STEP_SUMMARY
          echo "- All dependencies have compatible licenses" >> $GITHUB_STEP_SUMMARY
          echo "- No copyleft licenses in proprietary code" >> $GITHUB_STEP_SUMMARY
          echo "- Attribution requirements are met" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Security Status Summary
  # ===========================================================================
  security-status:
    name: Security Status
    needs: [secret-scanning, dependency-scan, sast-scan, license-check]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Evaluate Security Status
        run: |
          echo "## Required Security Baseline - Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scanning | ${{ needs.secret-scanning.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST Analysis | ${{ needs.sast-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License Check | ${{ needs.license-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check if any critical checks failed
          if [[ "${{ needs.secret-scanning.result }}" == "failure" ]] || \
             [[ "${{ needs.sast-scan.result }}" == "failure" ]]; then
            echo "⛔ **Critical security checks failed!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "This PR cannot be merged until security issues are resolved." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **All security checks passed**" >> $GITHUB_STEP_SUMMARY
          fi
