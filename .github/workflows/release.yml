# =============================================================================
# Release Workflow
# =============================================================================
# This workflow handles the complete release process triggered by tag creation.
# It builds all applications, runs tests, creates a GitHub Release, and
# optionally deploys to staging.
#
# Features:
# - Triggered by tag creation (v*.*.*)
# - Builds all applications
# - Runs full test suites
# - Creates GitHub Release with artifacts
# - Generates changelog
# - Optional deployment to staging
#
# Documentation:
# - https://docs.github.com/en/repositories/releasing-projects-on-github
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'  # Matches v1.0.0, v1.2.3-beta, etc.

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string
      deploy_to_staging:
        description: 'Deploy to staging after release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ===========================================================================
  # Validate Release
  # ===========================================================================
  validate:
    name: Validate Release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi

          # Remove 'v' prefix if present
          VERSION_CLEAN="${VERSION#v}"

          echo "version=${VERSION_CLEAN}" >> $GITHUB_OUTPUT

          # Check if pre-release
          if [[ "$VERSION_CLEAN" =~ -(alpha|beta|rc) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

          echo "## Release Version" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${VERSION_CLEAN} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${VERSION} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-release | ${{ steps.version.outputs.is_prerelease }} |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Build Applications
  # ===========================================================================
  build:
    name: Build Applications
    runs-on: ubuntu-latest
    needs: validate

    outputs:
      python-artifact: ${{ steps.build-python.outputs.artifact }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Python Build
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build Python Package
        id: build-python
        run: |
          cd apps/python-service
          pip install build wheel
          python -m build

          echo "artifact=python-microservice-${{ needs.validate.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Upload Python Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-release-${{ needs.validate.outputs.version }}
          path: apps/python-service/dist/*
          retention-days: 30

  # ===========================================================================
  # Test Suite
  # ===========================================================================
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          pip install -r apps/python-service/requirements.txt

      - name: Run Tests
        run: |
          cd apps/python-service
          pytest --cov=app --cov-report=xml --cov-report=term

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/python-service/coverage.xml

  # ===========================================================================
  # Create GitHub Release
  # ===========================================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [validate, build, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-release-*'
          path: release-artifacts
          merge-multiple: true

      - name: Generate Changelog
        id: changelog
        run: |
          # Get previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          echo "## What's Changed" > CHANGELOG_RELEASE.md
          echo "" >> CHANGELOG_RELEASE.md

          if [ -n "$PREVIOUS_TAG" ]; then
            # Generate changelog from commits
            echo "### Commits" >> CHANGELOG_RELEASE.md
            git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..HEAD >> CHANGELOG_RELEASE.md
            echo "" >> CHANGELOG_RELEASE.md
            echo "" >> CHANGELOG_RELEASE.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...v${{ needs.validate.outputs.version }}" >> CHANGELOG_RELEASE.md
          else
            echo "Initial release" >> CHANGELOG_RELEASE.md
          fi

          cat CHANGELOG_RELEASE.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: Release v${{ needs.validate.outputs.version }}
          body_path: CHANGELOG_RELEASE.md
          draft: false
          prerelease: ${{ needs.validate.outputs.is_prerelease == 'true' }}
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "## Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Release v${{ needs.validate.outputs.version }} has been created!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts Included" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -la release-artifacts/ >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No artifacts found"

  # ===========================================================================
  # Deploy to Staging (Optional)
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [validate, release]
    if: github.event.inputs.deploy_to_staging == 'true'

    environment:
      name: staging
      url: https://staging.example.com

    steps:
      - name: Deploy to Staging
        run: |
          echo "🚀 Deploying v${{ needs.validate.outputs.version }} to staging..."
          echo ""
          echo "This would:"
          echo "  1. Download release artifacts"
          echo "  2. Deploy to staging environment"
          echo "  3. Run smoke tests"
          echo "  4. Notify team"
          echo ""
          echo "✅ Deployment simulated successfully"
