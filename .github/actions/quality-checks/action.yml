# =============================================================================
# Composite Action: Quality Checks
# =============================================================================
# This composite action provides unified code quality validation across
# different technology stacks.
#
# Features:
# - Auto-detection of linters based on stack
# - Security linting (Semgrep, Bandit, etc.)
# - Quality report generation
# - PR commenting with results
# - SARIF upload support
#
# Usage:
#   - name: Run Quality Checks
#     uses: ./.github/actions/quality-checks
#     with:
#       working-directory: apps/python-service
#       linter: auto
#       fail-on-error: true
#
# Documentation:
# - https://docs.github.com/en/actions/creating-actions/creating-a-composite-action
# =============================================================================

name: 'Run Quality Checks'
description: 'Unified code quality validation for multiple technology stacks'
author: 'GitHub Actions Demo Team'

# =============================================================================
# Branding
# =============================================================================
branding:
  icon: 'check-circle'
  color: 'green'

# =============================================================================
# Input Parameters
# =============================================================================
inputs:
  working-directory:
    description: 'Path to the code to analyze'
    required: false
    default: '.'

  linter:
    description: 'Linter to use (auto, pylint, flake8, eslint, etc.)'
    required: false
    default: 'auto'

  fail-on-error:
    description: 'Whether to fail the action on quality issues'
    required: false
    default: 'true'

  upload-results:
    description: 'Whether to upload SARIF results'
    required: false
    default: 'true'

  security-scan:
    description: 'Whether to run security linting'
    required: false
    default: 'true'

  stack-type:
    description: 'Technology stack (python, node, java, dotnet) - used for auto-detection'
    required: false
    default: 'auto'

# =============================================================================
# Output Values
# =============================================================================
outputs:
  lint-status:
    description: 'Linting status (success/failure/warning)'
    value: ${{ steps.summary.outputs.lint-status }}

  security-status:
    description: 'Security scan status'
    value: ${{ steps.summary.outputs.security-status }}

  issues-found:
    description: 'Number of issues found'
    value: ${{ steps.summary.outputs.issues-found }}

  quality-score:
    description: 'Overall quality score (0-100)'
    value: ${{ steps.summary.outputs.quality-score }}

# =============================================================================
# Action Steps
# =============================================================================
runs:
  using: 'composite'
  steps:
    # -------------------------------------------------------------------------
    # Detect Stack and Linter
    # -------------------------------------------------------------------------
    - name: Detect Stack Type
      id: detect
      shell: bash
      run: |
        cd "${{ inputs.working-directory }}"

        STACK="${{ inputs.stack-type }}"

        if [ "$STACK" = "auto" ]; then
          # Auto-detect based on files present
          if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ] || [ -f "setup.py" ]; then
            STACK="python"
          elif [ -f "package.json" ]; then
            STACK="node"
          elif [ -f "pom.xml" ] || [ -f "build.gradle" ]; then
            STACK="java"
          elif [ -f "*.csproj" ] || [ -f "*.sln" ]; then
            STACK="dotnet"
          else
            STACK="unknown"
          fi
        fi

        echo "stack=${STACK}" >> $GITHUB_OUTPUT
        echo "Detected stack type: ${STACK}"

        # Determine linter based on stack
        LINTER="${{ inputs.linter }}"
        if [ "$LINTER" = "auto" ]; then
          case "$STACK" in
            python)
              if [ -f ".flake8" ] || [ -f "setup.cfg" ]; then
                LINTER="flake8"
              else
                LINTER="pylint"
              fi
              ;;
            node)
              LINTER="eslint"
              ;;
            java)
              LINTER="checkstyle"
              ;;
            dotnet)
              LINTER="dotnet-format"
              ;;
            *)
              LINTER="none"
              ;;
          esac
        fi

        echo "linter=${LINTER}" >> $GITHUB_OUTPUT
        echo "Using linter: ${LINTER}"

    # -------------------------------------------------------------------------
    # Python Linting
    # -------------------------------------------------------------------------
    - name: Run Flake8 (Python)
      id: flake8
      if: steps.detect.outputs.stack == 'python' && (steps.detect.outputs.linter == 'flake8' || inputs.linter == 'flake8')
      shell: bash
      continue-on-error: true
      run: |
        cd "${{ inputs.working-directory }}"

        # Check if flake8 is installed
        if ! command -v flake8 &> /dev/null; then
          pip install flake8
        fi

        echo "::group::Running Flake8"
        flake8 . --count --statistics --show-source > flake8-report.txt 2>&1 || true
        ERRORS=$(grep -c "^[A-Z]" flake8-report.txt 2>/dev/null || echo "0")
        cat flake8-report.txt
        echo "::endgroup::"

        echo "errors=${ERRORS}" >> $GITHUB_OUTPUT

        if [ "$ERRORS" -gt 0 ]; then
          echo "::warning::Flake8 found ${ERRORS} issues"
        fi

    - name: Run Pylint (Python)
      id: pylint
      if: steps.detect.outputs.stack == 'python' && (steps.detect.outputs.linter == 'pylint' || inputs.linter == 'pylint')
      shell: bash
      continue-on-error: true
      run: |
        cd "${{ inputs.working-directory }}"

        # Check if pylint is installed
        if ! command -v pylint &> /dev/null; then
          pip install pylint
        fi

        echo "::group::Running Pylint"
        # Find Python packages/modules
        MODULES=$(find . -name "*.py" -not -path "./.venv/*" -not -path "./venv/*" -not -name "setup.py" | head -20)

        if [ -n "$MODULES" ]; then
          pylint $MODULES --output-format=colorized --exit-zero --score=y 2>&1 | tee pylint-report.txt
          SCORE=$(grep "Your code has been rated at" pylint-report.txt | grep -oP "[0-9]+\.[0-9]+" | head -1 || echo "0")
        else
          echo "No Python modules found to lint"
          SCORE="N/A"
        fi
        echo "::endgroup::"

        echo "score=${SCORE}" >> $GITHUB_OUTPUT

    # -------------------------------------------------------------------------
    # Security Scanning
    # -------------------------------------------------------------------------
    - name: Run Security Scan (Python - Bandit)
      id: bandit
      if: inputs.security-scan == 'true' && steps.detect.outputs.stack == 'python'
      shell: bash
      continue-on-error: true
      run: |
        cd "${{ inputs.working-directory }}"

        # Check if bandit is installed
        if ! command -v bandit &> /dev/null; then
          pip install bandit
        fi

        echo "::group::Running Bandit Security Scan"
        bandit -r . -f json -o bandit-results.json --exit-zero 2>/dev/null || true
        bandit -r . --exit-zero || true
        echo "::endgroup::"

        # Count security issues
        if [ -f "bandit-results.json" ]; then
          ISSUES=$(cat bandit-results.json | python -c "import sys,json; data=json.load(sys.stdin); print(len(data.get('results', [])))" 2>/dev/null || echo "0")
        else
          ISSUES=0
        fi

        echo "issues=${ISSUES}" >> $GITHUB_OUTPUT

    # -------------------------------------------------------------------------
    # Generate Summary
    # -------------------------------------------------------------------------
    - name: Generate Quality Summary
      id: summary
      shell: bash
      run: |
        cd "${{ inputs.working-directory }}"

        LINT_STATUS="success"
        SECURITY_STATUS="success"
        ISSUES_FOUND=0
        QUALITY_SCORE=100

        # Calculate based on results
        if [ "${{ steps.flake8.outputs.errors }}" != "" ] && [ "${{ steps.flake8.outputs.errors }}" -gt 0 ]; then
          LINT_STATUS="warning"
          ISSUES_FOUND=$((ISSUES_FOUND + ${{ steps.flake8.outputs.errors }}))
        fi

        if [ "${{ steps.pylint.outputs.score }}" != "" ] && [ "${{ steps.pylint.outputs.score }}" != "N/A" ]; then
          # Convert pylint score to percentage
          PYLINT_SCORE=$(echo "${{ steps.pylint.outputs.score }}" | cut -d'/' -f1)
          QUALITY_SCORE=$(echo "scale=0; ${PYLINT_SCORE} * 10" | bc 2>/dev/null || echo "0")
        fi

        if [ "${{ steps.bandit.outputs.issues }}" != "" ] && [ "${{ steps.bandit.outputs.issues }}" -gt 0 ]; then
          SECURITY_STATUS="warning"
          ISSUES_FOUND=$((ISSUES_FOUND + ${{ steps.bandit.outputs.issues }}))
        fi

        echo "lint-status=${LINT_STATUS}" >> $GITHUB_OUTPUT
        echo "security-status=${SECURITY_STATUS}" >> $GITHUB_OUTPUT
        echo "issues-found=${ISSUES_FOUND}" >> $GITHUB_OUTPUT
        echo "quality-score=${QUALITY_SCORE}" >> $GITHUB_OUTPUT

        # Generate step summary
        echo "## Quality Check Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Stack | ${{ steps.detect.outputs.stack }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Linter | ${{ steps.detect.outputs.linter }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Lint Status | ${LINT_STATUS} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security Status | ${SECURITY_STATUS} |" >> $GITHUB_STEP_SUMMARY
        echo "| Issues Found | ${ISSUES_FOUND} |" >> $GITHUB_STEP_SUMMARY
        echo "| Quality Score | ${QUALITY_SCORE}/100 |" >> $GITHUB_STEP_SUMMARY

    # -------------------------------------------------------------------------
    # Upload Results
    # -------------------------------------------------------------------------
    - name: Upload Quality Reports
      if: inputs.upload-results == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: quality-reports-${{ github.run_id }}
        path: |
          ${{ inputs.working-directory }}/*-report.txt
          ${{ inputs.working-directory }}/*-results.json
        retention-days: 30
        if-no-files-found: ignore

    # -------------------------------------------------------------------------
    # Fail if Required
    # -------------------------------------------------------------------------
    - name: Check Quality Threshold
      if: inputs.fail-on-error == 'true'
      shell: bash
      run: |
        ISSUES="${{ steps.summary.outputs.issues-found }}"
        LINT_STATUS="${{ steps.summary.outputs.lint-status }}"

        if [ "$LINT_STATUS" = "failure" ]; then
          echo "::error::Quality checks failed with ${ISSUES} issues"
          exit 1
        fi

        echo "✅ Quality checks passed"
